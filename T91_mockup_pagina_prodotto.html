<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>T91 · Pagina prodotto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A0A;
  --ink2:#1D1D1F;
  --paper:#FFFFFF;
  --fog:#F5F5F7;
  --line:#E5E5EA;
  --mute:#6E6E73;
  --volt:#D4FF00;
  --klarna:#FFB3C7;
  --gut:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Questrial',system-ui,sans-serif;background:var(--paper);color:var(--ink2);font-size:17px;line-height:1.5;font-synthesis:none;overflow-x:hidden;-webkit-font-smoothing:antialiased}
b,strong{font-weight:400}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}

/* ============ PRESENTAZIONE (prefisso x-) ============ */
.x-wrap{max-width:1180px;margin:0 auto;padding:0 var(--gut)}
.x-narrow{max-width:820px;margin:0 auto;padding:0 var(--gut)}
@media(min-width:900px){:root{--gut:40px}}

.x-nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.x-nav .x-wrap{display:flex;align-items:center;gap:28px;height:48px}
.x-nav .br{display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.x-nav .br img{height:24px;width:auto}
.x-nav nav{display:flex;gap:22px;margin-left:auto;font-size:12.5px;color:#424245;overflow-x:auto;scrollbar-width:none}
.x-nav nav::-webkit-scrollbar{display:none}
.x-nav nav a{white-space:nowrap}
.x-nav nav a:hover{color:var(--ink)}
@media(max-width:899px){.x-nav nav{display:none}}

.x-sec{padding:120px 0}
.x-sec.fog{background:var(--fog)}
.x-sec.dark{background:#000;color:#F5F5F7}
@media(max-width:899px){.x-sec{padding:80px 0}}
.x-center{text-align:center}
.x-eye{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--mute);margin-bottom:14px}
.x-eye::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.dark .x-eye{color:#A1A1A6}
.x-h1{font-size:clamp(48px,8vw,96px);line-height:1.02;letter-spacing:-.035em}
.x-h2{font-size:clamp(36px,5.4vw,64px);line-height:1.05;letter-spacing:-.03em}
.x-h3{font-size:clamp(24px,2.6vw,32px);line-height:1.12;letter-spacing:-.02em}
.x-sub{font-size:clamp(19px,2vw,24px);line-height:1.4;color:var(--mute);margin-top:18px;letter-spacing:-.01em}
.dark .x-sub{color:#A1A1A6}
.x-center .x-sub{margin-left:auto;margin-right:auto;max-width:720px}
.x-more{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-size:17px;margin-top:22px;border-bottom:1px solid currentColor}
.x-pill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:980px;padding:12px 22px;font-size:15px}
.x-pill.v{background:var(--volt);color:var(--ink)}
.x-tag{display:inline-block;font-size:12px;letter-spacing:.02em;padding:4px 10px;border-radius:980px;background:var(--fog);color:var(--ink2)}
.dark .x-tag{background:#1D1D1F;color:#F5F5F7}

/* hero */
.x-hero{padding:96px 0 0;text-align:center;overflow:hidden}
.x-hero .lg{height:72px;width:auto;margin:0 auto 28px}
.x-hero .x-sub{max-width:640px;margin-left:auto;margin-right:auto}
.x-hero .ctas{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.x-hero .stage{position:relative;max-width:980px;margin:56px auto 0;aspect-ratio:16/8;background:#000;border-radius:28px 28px 0 0;overflow:hidden}
.x-hero .stage img{width:100%;height:100%;object-fit:cover}
.x-hero .meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}

/* index */
.x-index{display:grid;gap:12px;margin-top:56px}
@media(min-width:700px){.x-index{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.x-index{grid-template-columns:repeat(4,1fr)}}
.x-index a{background:#fff;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .2s}
.x-index a:hover{transform:translateY(-3px)}
.x-index .n{font-size:13px;color:var(--mute)}
.x-index .t{font-size:21px;letter-spacing:-.015em;line-height:1.15}
.x-index .d{font-size:14px;color:var(--mute);margin-top:auto}

/* numbers */
.x-nums{display:grid;gap:40px;margin-top:72px}
@media(min-width:800px){.x-nums{grid-template-columns:repeat(4,1fr);gap:24px}}
.x-num .n{font-size:clamp(48px,5vw,64px);letter-spacing:-.04em;line-height:1}
.x-num .d{font-size:15px;color:var(--mute);margin-top:10px}
.x-num .a{font-size:15px;margin-top:10px;display:flex;gap:6px}
.x-num .a::before{content:"→"}
.x-quote{margin-top:80px;font-size:clamp(24px,3vw,36px);line-height:1.25;letter-spacing:-.02em;max-width:900px}
.x-quote span{color:var(--mute)}

/* sitemap */
.x-map{margin-top:64px;background:#fff;border-radius:28px;padding:28px;overflow:hidden}
@media(min-width:900px){.x-map{padding:40px}}
.x-menu{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line)}
.x-menu span{font-size:14px;padding:8px 14px;border-radius:980px;background:var(--fog)}
.x-menu span.on{background:var(--ink);color:#fff}
.x-menu span.v{background:var(--volt)}
.x-cols{display:grid;gap:28px;margin-top:28px}
@media(min-width:800px){.x-cols{grid-template-columns:repeat(3,1fr)}}
.x-cols h5{font-weight:400;font-size:13px;color:var(--mute);margin-bottom:10px}
.x-cols li{list-style:none;padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:16px}
.x-cols li code{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mute);white-space:nowrap}
.x-why{display:grid;gap:16px;margin-top:20px}
@media(min-width:800px){.x-why{grid-template-columns:repeat(3,1fr)}}
.x-why div{background:#fff;border-radius:22px;padding:24px}
.x-why b{display:block;font-size:19px;letter-spacing:-.01em;margin-bottom:6px}
.x-why p{font-size:15px;color:var(--mute)}

/* devices */
.x-devs{display:grid;gap:40px;margin-top:64px;align-items:start}
@media(min-width:1050px){.x-devs{grid-template-columns:1fr 340px}}
.fitwrap{position:relative;width:100%;overflow:hidden}
.fitwrap>.device{position:absolute;left:0;top:0;transform-origin:0 0}
.device.desk{width:1280px;background:#E8E8ED;border-radius:18px;padding:0 0 0;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.18)}
.device.desk .chrome{height:44px;display:flex;align-items:center;gap:14px;padding:0 16px}
.device.desk .chrome .dots{display:flex;gap:7px}
.device.desk .chrome .dots i{width:12px;height:12px;border-radius:50%;display:block;background:#C7C7CC}
.device.desk .chrome .url{flex:1;max-width:560px;margin:0 auto;background:#fff;color:var(--mute);font-size:12.5px;padding:6px 14px;border-radius:8px;text-align:center}
.device.desk .screen{width:1280px;height:780px}
.device.phone{width:414px;padding:12px;background:#1D1D1F;border-radius:60px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.device.phone .screen{width:390px;height:844px;border-radius:48px}
.screen{position:relative;overflow:hidden;background:#fff;container:dev / inline-size}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.x-phonecol{width:100%;max-width:340px;margin:0 auto}
.x-explore{margin-top:40px;text-align:center}
.x-explore p{font-size:15px;color:var(--mute);margin-bottom:14px}
.x-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.x-chips button{font-size:14px;padding:9px 16px;border-radius:980px;background:#fff;border:1px solid var(--line);transition:background .15s}
.x-chips button:hover,.x-chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.x-chips button.v{background:var(--volt);border-color:var(--volt)}

/* bento */
.x-group{margin-top:88px}
.x-ghead{display:grid;grid-template-columns:56px 1fr;gap:18px;align-items:start;padding-top:28px;border-top:1px solid #D2D2D7;margin-bottom:24px}
.x-ghead .gn{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--volt);display:grid;place-items:center;font-size:20px}
.x-ghead h3{font-weight:400;font-size:clamp(28px,3.2vw,40px);letter-spacing:-.025em;line-height:1.05}
.x-ghead p{font-size:19px;color:#3A3A3C;margin-top:6px}
.x-bento{display:grid;gap:16px}
@media(min-width:800px){.x-bento{grid-template-columns:repeat(2,1fr)}}
.x-tile{background:#fff;border-radius:28px;padding:34px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative}
.x-tile.w2{grid-column:span 1}
@media(min-width:800px){.x-tile.w2{grid-column:span 2}}
.x-go{align-self:flex-start;margin-top:18px;font-size:14px;color:var(--ink);border-bottom:1px solid currentColor;padding-bottom:1px}
.x-tile.k .x-go{color:#fff}
.x-tile.k{background:#000;color:#F5F5F7}
.x-tile.v{background:var(--volt)}
.x-tile .lb{font-size:14px;color:var(--mute);letter-spacing:.01em}
.x-tile.k .lb{color:#A1A1A6}
.x-tile.v .lb{color:#333}
.x-tile h3{font-weight:400;font-size:clamp(26px,2.4vw,32px);line-height:1.1;letter-spacing:-.02em;max-width:22ch}
.x-tile p{font-size:18px;line-height:1.45;color:#3A3A3C;max-width:46ch}
.x-tile.k p{color:#C7C7CC}
.x-tile.v p{color:#222}
.x-tile .vis{margin-top:auto;padding-top:28px}
.x-new{position:absolute;top:24px;right:24px;font-size:11px;letter-spacing:.06em;background:var(--volt);color:var(--ink);padding:4px 9px;border-radius:980px}
.x-tile.v .x-new{background:var(--ink);color:var(--volt)}

/* mini visuals */
.mv-card{background:var(--fog);border-radius:18px;padding:18px;color:var(--ink)}
.mv-price{font-size:34px;letter-spacing:-.03em}
.mv-kl{font-size:14px;color:var(--mute);margin-top:4px}
.klarna{background:var(--klarna);color:var(--ink);font-style:normal;padding:2px 8px;border-radius:6px;font-size:13px}
.mv-seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mv-seg div{border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;background:#fff;color:var(--ink)}
.mv-seg div.on{border:2px solid var(--ink)}
.mv-seg small{display:block;color:var(--mute);font-size:12px}
.mv-ship{background:var(--volt);color:var(--ink);border-radius:14px;padding:14px 16px;font-size:14px;letter-spacing:.04em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.mv-ship b{background:var(--ink);color:var(--volt);padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums}
.mv-rows{background:var(--fog);border-radius:18px;overflow:hidden;color:var(--ink)}
.mv-rows div{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px}
.mv-rows div:last-child{border:0}
.mv-rows span small{display:block;color:var(--mute);font-size:12px}
.mv-stars{display:flex;align-items:flex-end;gap:14px}
.mv-stars .n{font-size:84px;line-height:.85;letter-spacing:-.05em}
.mv-stars .s{font-size:20px;letter-spacing:2px}
.mv-club{display:flex;border-radius:14px;overflow:hidden;background:var(--ink);color:#fff;font-size:15px}
.mv-club span:first-child{background:var(--volt);color:var(--ink);padding:14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;line-height:1.15}
.mv-club span:last-child{padding:14px;display:flex;align-items:center;gap:8px}
.mv-club b{color:var(--volt);font-size:18px}
.mv-img{border-radius:18px;overflow:hidden;position:relative;aspect-ratio:16/10;background:#111}
.mv-img img{width:100%;height:100%;object-fit:cover}
.mv-play{position:absolute;left:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink)}
.mv-dot{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--volt);border:2px solid #000;margin:-11px 0 0 -11px}
.mv-cmp{background:var(--fog);border-radius:18px;overflow:hidden;font-size:13px;color:var(--ink)}
.mv-cmp table{width:100%;border-collapse:collapse}
.mv-cmp th,.mv-cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.mv-cmp th{color:var(--mute);font-size:12px}
.mv-cmp .c{background:#FAFFE0}
.mv-row{display:flex;gap:10px}
.mv-row div{flex:1;background:var(--fog);border-radius:14px;aspect-ratio:1/1;display:grid;place-items:center;overflow:hidden}
.mv-row img{width:78%;height:78%;object-fit:contain}
.mv-pin{display:flex;gap:12px;align-items:center;background:var(--fog);border-radius:18px;padding:16px;color:var(--ink);font-size:15px}
.mv-pin i{width:10px;height:10px;border-radius:50%;background:#34C759;flex:none}
.mv-pin small{display:block;color:var(--mute);font-size:13px}

/* tools */
.x-tools{display:grid;gap:16px;margin-top:64px}
@media(min-width:760px){.x-tools{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1050px){.x-tools{grid-template-columns:repeat(3,1fr)}}
.x-tool{background:#1D1D1F;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:12px}
.x-tool .ic{width:48px;height:48px;border-radius:14px;background:#2C2C2E;display:grid;place-items:center;color:var(--volt)}
.x-tool .ic svg{width:24px;height:24px}
.x-tool h3{font-weight:400;font-size:22px;letter-spacing:-.015em;color:#F5F5F7}
.x-tool p{font-size:15px;color:#A1A1A6}
.x-tool dl{margin-top:auto;padding-top:14px;border-top:1px solid #2C2C2E;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.x-tool dt{color:#6E6E73}
.x-tool dd{color:#D2D2D7}

/* cart explain */
.x-split{display:grid;gap:48px;align-items:center;margin-top:64px}
@media(min-width:950px){.x-split{grid-template-columns:1fr 1fr;gap:80px}}
.x-steps{list-style:none;display:flex;flex-direction:column;gap:0;margin-top:28px}
.x-steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.dark .x-steps li{border-color:#2C2C2E}
.x-steps .n{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px}
.dark .x-steps .n{background:var(--volt);color:var(--ink)}
.x-steps b{display:block;font-size:18px;letter-spacing:-.01em}
.x-steps span{font-size:15px;color:var(--mute)}
.dark .x-steps span{color:#A1A1A6}

/* services */
.x-serv{display:grid;gap:16px;margin-top:64px}
@media(min-width:760px){.x-serv{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1050px){.x-serv{grid-template-columns:repeat(3,1fr)}}
.x-sv{background:#fff;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:10px;min-height:260px}
.x-sv .k{font-size:13px;color:var(--mute)}
.x-sv h3{font-weight:400;font-size:26px;letter-spacing:-.02em}
.x-sv p{font-size:15px;color:var(--mute)}
.x-sv code{margin-top:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mute)}
.x-flow{display:grid;gap:12px;margin-top:20px}
@media(min-width:900px){.x-flow{grid-template-columns:repeat(5,1fr)}}
.x-flow div{background:#fff;border-radius:20px;padding:20px}
.x-flow .s{font-size:13px;color:var(--mute)}
.x-flow .t{font-size:18px;margin-top:6px;letter-spacing:-.01em}
.x-flow .d{font-size:14px;color:var(--mute);margin-top:4px}

/* team */
.x-team{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:56px}
@media(min-width:800px){.x-team{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.x-team{grid-template-columns:repeat(6,1fr)}}
.x-pro{background:#1D1D1F;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.x-pro .ph{aspect-ratio:4/5;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2C2C2E,#111)}
.x-pro .ph img{width:72%;transform:rotate(-12deg) translateY(10%)}
.x-pro .bd{padding:14px}
.x-pro .nm{font-size:16px;color:#F5F5F7}
.x-pro .rk{font-size:12px;color:#A1A1A6;margin-top:2px}
.x-pro.more{background:var(--volt);color:var(--ink);align-items:center;justify-content:center;text-align:center;padding:20px;min-height:220px}
.x-pro.more .big{font-size:56px;letter-spacing:-.04em;line-height:1}
.x-3{display:grid;gap:16px;margin-top:16px}
@media(min-width:800px){.x-3{grid-template-columns:repeat(3,1fr)}}
.x-3 div{background:#1D1D1F;border-radius:22px;padding:24px}
.x-3 b{display:block;font-size:19px;color:#F5F5F7;margin-bottom:6px}
.x-3 p{font-size:15px;color:#A1A1A6}

/* club */
.x-plans{display:grid;gap:16px;margin-top:64px}
@media(min-width:900px){.x-plans{grid-template-columns:1fr 1.2fr}}
.x-plan{border-radius:28px;padding:36px;background:#fff;display:flex;flex-direction:column;gap:16px}
.x-plan.k{background:#000;color:#F5F5F7}
.x-plan .pn{font-size:15px;color:var(--mute)}
.x-plan.k .pn{color:#A1A1A6}
.x-plan .pr{font-size:64px;letter-spacing:-.04em;line-height:1}
.x-plan .pr small{font-size:17px;color:var(--mute);letter-spacing:0}
.x-plan ul{list-style:none}
.x-plan li{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;font-size:16px}
.x-plan.k li{border-color:#2C2C2E}
.x-plan li::before{content:"✓";color:var(--ink)}
.x-plan.k li::before{color:var(--volt)}
.x-plan li.x{color:var(--mute)}
.x-plan li.x::before{content:"–";color:var(--mute)}
.x-roi{display:grid;gap:12px;margin-top:16px;grid-template-columns:repeat(2,1fr)}
@media(min-width:800px){.x-roi{grid-template-columns:repeat(4,1fr)}}
.x-roi div{background:#fff;border-radius:20px;padding:20px}
.x-roi .n{font-size:30px;letter-spacing:-.03em}
.x-roi .l{font-size:13px;color:var(--mute);margin-top:4px}
.x-roi .v{background:var(--volt)}
.x-roi .v .l{color:#333}
.x-note{display:flex;gap:14px;margin-top:20px;background:#fff;border-radius:18px;padding:18px 20px;font-size:15px;color:var(--mute)}
.x-note b{color:var(--ink);flex:none}
.dark .x-note{background:#1D1D1F;color:#A1A1A6}
.dark .x-note b{color:var(--volt)}

/* blog */
.x-rubs{display:grid;gap:12px;margin-top:56px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.x-rubs{grid-template-columns:repeat(4,1fr)}}
.x-rub{background:var(--fog);border-radius:22px;padding:22px}
.x-rub b{display:block;font-size:20px;letter-spacing:-.01em}
.x-rub span{font-size:14px;color:var(--mute)}
.x-rub.v{background:var(--volt)}
.x-rub.v span{color:#333}
.x-plan-ed{margin-top:40px;border-top:1px solid var(--line)}

/* tech */

/* timeline */

/* ============ PDP (dentro i device, container query) ============ */

.p-sec{padding:44px 14px}

<script>
(function(){

function t91Menu(root,toastHost){
  const mm=root.querySelector('.p-mm'); if(!mm) return;
  const $$=s=>[...mm.querySelectorAll(s)], l1=mm.querySelector('.pane.l1');
  const back=()=>{$$('.pane.l2').forEach(p=>p.classList.remove('in'));l1.classList.remove('away');};
  root.querySelectorAll('.js-menu').forEach(b=>b.onclick=()=>mm.classList.add('open'));
  mm.querySelector('.js-mclose').onclick=()=>{mm.classList.remove('open');setTimeout(back,350);};
  $$('[data-go]').forEach(b=>b.onclick=()=>{$$('.pane.l2').forEach(p=>p.classList.toggle('in',p.dataset.pane===b.dataset.go));l1.classList.add('away');});
  $$('.js-mback').forEach(b=>b.onclick=back);
}
function t91Mega(root){
  const head=root.querySelector('.p-head'),mega=root.querySelector('.p-mega'); if(!head||!mega)return;
  const links=[...head.querySelectorAll('.p-nav a[data-mega]')];
  let t;
  const show=k=>{clearTimeout(t);mega.classList.add('open');mega.querySelectorAll('.mg').forEach(m=>m.classList.toggle('on',m.dataset.k===k));links.forEach(a=>a.classList.toggle('hov',a.dataset.mega===k));};
  const hide=()=>{t=setTimeout(()=>{mega.classList.remove('open');links.forEach(a=>a.classList.remove('hov'));},140);};
  links.forEach(a=>{a.addEventListener('mouseenter',()=>show(a.dataset.mega));a.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(mega.classList.contains('open')&&a.classList.contains('hov')){clearTimeout(t);mega.classList.remove('open');links.forEach(x=>x.classList.remove('hov'));}else show(a.dataset.mega);});});

}

    const ms=cut-now;const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);

    $$('.p-rf button').forEach(b=>b.onclick=()=>{$$('.p-rf button').forEach(x=>x.classList.toggle('on',x===b));const f=b.dataset.f;$$('.p-rc').forEach((c,i)=>c.classList.toggle('hide',!(f==='all'?i<3:c.dataset.l.split(' ').includes(f))));});
